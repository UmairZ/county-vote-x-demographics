version: 2

sources:
  - name: raw
    database: "{{ env_var('GCP_PROJECT') }}"
    schema: "{{ env_var('BQ_DATASET', 'elections') }}"
    tables:
      - name: raw_county_president
        description: >
          MIT Election Data and Science Lab, County Presidential Election
          Returns 2000-2024 (CC0). Loaded WRITE_TRUNCATE from a manual
          Dataverse download.
      - name: raw_census_acs5
        description: >
          Census ACS 5-year county detail tables, pulled from the Census
          Data API by pipeline/etl.py.

models:
  - name: stg_election
    description: >
      One row per county-year-office-party. Two-party only, FIPS zero-padded
      to 5 characters, vote modes collapsed without double-counting.
    columns:
      - name: county_fips
        description: 5-character county FIPS, the cross-match key.
        data_tests:
          - not_null

          # The cross-match gate. Asserts every election FIPS resolves to a
          # Census county. The mart joins INNER, so unmatched rows disappear
          # silently; this is what makes that loss visible.
          - relationships:
              arguments:
                to: ref('stg_census')
                field: county_fips
              config:
                # severity must be `error` for error_if to be reachable.
                # `severity: warn` caps the outcome and makes any error_if
                # threshold decorative. Checked by breaking the padding on
                # purpose: 4,624 failures still only warned.
                severity: error
                warn_if: ">0"
                # Writes the failing rows to an audit table instead of just
                # reporting a count, so the flagged geographies stay queryable.
                store_failures: true
                # Baseline is 678 rows (339 county-years x 2 parties): Alaska's
                # 38 house-district pseudo-FIPS, Connecticut's 8 counties,
                # Kansas City, Bedford City VA, Oglala Lakota. See the README.
                # A structural break misses thousands at once.
                error_if: ">1000"

      - name: election_year
        data_tests:
          - not_null

      - name: party
        description: >
          stg_election filters to these two, so this guards the filter itself
          if the WHERE clause is ever loosened.
        data_tests:
          - accepted_values:
              arguments:
                values: ["DEMOCRAT", "REPUBLICAN"]

  - name: stg_census
    description: ACS 5-year county demographics, one row per county.
    columns:
      - name: county_fips
        description: >
          5-character county FIPS, the cross-match key. stg_census is the
          right side of an inner join, so a duplicate FIPS would fan out and
          double every vote total. Hence `unique`.
        data_tests:
          - not_null
          - unique
