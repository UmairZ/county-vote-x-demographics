version: 2

models:
  - name: county_vote_x_demographics
    description: >
      County-level two-party presidential vote joined to ACS 5-year
      demographics on 5-digit county FIPS. One row per county per election
      year per office.
    columns:
      - name: county_year_office_key
        description: >
          The grain, and the unique_key the incremental MERGE dedupes on.
          Tested unique because a misconfigured MERGE fails by duplicating
          rows, which looks like plausible data rather than an error.
        data_tests:
          - not_null
          - unique

      - name: county_fips
        data_tests:
          - not_null

      - name: election_year
        data_tests:
          - not_null

      - name: total_population
        description: >
          Null would mean a cross-matched row with no ACS data, which the
          inner join should make impossible. If this fires, the join logic
          changed.
        data_tests:
          - not_null
