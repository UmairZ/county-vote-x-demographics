[project]
name = "county-vote-x-demographics"
version = "0.1.0"
description = "County election returns x Census ACS demographics: BigQuery + dbt + Dagster"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery>=1.9",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-webserver>=1.9",
]

[tool.dagster]
module_name = "pipeline.definitions"
code_location_name = "county_vote_x_demographics"
